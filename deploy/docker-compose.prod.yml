services:
  redis:
    image: redis:7-alpine
    container_name: synapsetab-redis-prod
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
    volumes:
      - synapsetab_redis_prod_data:/data
    networks:
      - synapsetab-internal
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  server:
    image: ghcr.io/marco/synapsetab-server:latest
    # Or build locally:
    # build:
    #   context: ../server
    #   dockerfile: Dockerfile
    container_name: synapsetab-server-prod
    ports:
      # Bind to localhost or internal network when behind reverse proxy
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - SYNC_SECRET=${SYNC_SECRET:?Please set SYNC_SECRET in .env}
      - USER_ID=${USER_ID:-default}
      - BACKUP_INTERVAL=${BACKUP_INTERVAL:-daily}
      - BACKUP_RETENTION_COPIES=${BACKUP_RETENTION_COPIES:-10}
      - NODE_ENV=production
    networks:
      - synapsetab-internal
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  synapsetab-internal:
    driver: bridge

volumes:
  synapsetab_redis_prod_data:
    driver: local
