<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1B20" />
      <stop offset="50%" stop-color="#131318" />
      <stop offset="100%" stop-color="#0E0E13" />
    </linearGradient>

    <linearGradient id="synapseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70D7E6" />
      <stop offset="45%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#D0BCFF" />
    </linearGradient>

    <linearGradient id="tabBorderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D0BCFF" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#47464F" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#70D7E6" stop-opacity="0.85" />
    </linearGradient>

    <radialGradient id="coreAmbientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#70D7E6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#131318" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nodeGlowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#D0BCFF" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nodeGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#70D7E6" />
      <stop offset="100%" stop-color="#70D7E6" stop-opacity="0" />
    </radialGradient>

    <filter id="synapseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="tabDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bgGradient)" stroke="#47464F" stroke-width="2.5" stroke-opacity="0.6"/>

  <circle cx="256" cy="256" r="190" fill="url(#coreAmbientGlow)" />

  <g filter="url(#tabDropShadow)" opacity="0.6">
    <path d="M 144 146 C 144 130, 156 118, 172 118 L 244 118 C 254 118, 263 124, 268 132 L 282 152 C 286 158, 294 162, 302 162 L 340 162 C 356 162, 368 174, 368 190 L 368 258 C 368 274, 356 286, 340 286 L 172 286 C 156 286, 144 274, 144 258 Z"
          fill="#1F1F25" stroke="#47464F" stroke-width="2" />
    
    <circle cx="174" cy="140" r="4" fill="#918F9A" opacity="0.6"/>
    <line x1="190" y1="140" x2="226" y2="140" stroke="#47464F" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g filter="url(#tabDropShadow)">
    <rect x="116" y="196" width="280" height="192" rx="28" fill="#1F1F25" stroke="url(#tabBorderGradient)" stroke-width="2.5" />
    
    <line x1="116" y1="248" x2="396" y2="248" stroke="#47464F" stroke-width="1.5" stroke-opacity="0.4" />
    
    <circle cx="148" cy="222" r="5" fill="#70D7E6" />
    <rect x="166" y="218" width="60" height="8" rx="4" fill="#47464F" fill-opacity="0.8" />
    <rect x="236" y="218" width="32" height="8" rx="4" fill="#35343A" />
    <rect x="276" y="218" width="32" height="8" rx="4" fill="#35343A" />
  </g>

  <g filter="url(#synapseGlow)">
    <path d="M 326 162 C 366 210, 314 262, 256 268 C 194 274, 154 304, 178 350"
          fill="none" stroke="url(#synapseGradient)" stroke-width="5.5" stroke-linecap="round" />

    <path d="M 256 268 C 220 238, 192 222, 148 222"
          fill="none" stroke="#70D7E6" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.75" stroke-dasharray="2 6" />

    <path d="M 256 268 C 296 292, 334 306, 352 342"
          fill="none" stroke="#D0BCFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
  </g>

  <circle cx="212" cy="272" r="3" fill="#FFFFFF" filter="url(#synapseGlow)" />
  <circle cx="298" cy="272" r="2.5" fill="#70D7E6" filter="url(#synapseGlow)" />
  <circle cx="340" cy="326" r="3" fill="#D0BCFF" filter="url(#synapseGlow)" />

  <g filter="url(#synapseGlow)">
    <circle cx="326" cy="162" r="18" fill="url(#nodeGlowCyan)" opacity="0.3" />
    <circle cx="326" cy="162" r="9" fill="#70D7E6" />
    <circle cx="326" cy="162" r="3.5" fill="#FFFFFF" />
  </g>

  <g filter="url(#synapseGlow)">
    <circle cx="256" cy="268" r="26" fill="url(#nodeGlowPurple)" opacity="0.4" />
    <circle cx="256" cy="268" r="14" fill="#D0BCFF" />
    <circle cx="256" cy="268" r="7" fill="#131318" />
    <circle cx="256" cy="268" r="3" fill="#FFFFFF" />
  </g>

  <g filter="url(#synapseGlow)">
    <circle cx="178" cy="350" r="18" fill="url(#nodeGlowCyan)" opacity="0.3" />
    <circle cx="178" cy="350" r="9" fill="#70D7E6" />
    <circle cx="178" cy="350" r="3.5" fill="#FFFFFF" />
  </g>
</svg>
