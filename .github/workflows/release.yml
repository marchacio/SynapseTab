name: Release & Distribution

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  package-extension:
    name: Package Firefox Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Extension Bundle
        run: npm run build:extension

      - name: Package Extension via web-ext
        run: |
          mkdir -p dist-packages
          npx web-ext build --source-dir=extension/dist --artifacts-dir=dist-packages --overwrite-dest

      - name: Upload Extension Artifact
        uses: actions/upload-artifact@v4
        with:
          name: synapsetab-extension-${{ github.ref_name }}
          path: dist-packages/*.zip

  docker-build-and-push:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [package-extension, docker-build-and-push]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Extension Artifact
        uses: actions/download-artifact@v4
        with:
          name: synapsetab-extension-${{ github.ref_name }}
          path: dist-packages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-packages/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
