services:
  redis:
    image: redis:7-alpine
    container_name: synapsetab-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped

  server:
    image: node:22-alpine
    container_name: synapsetab-server-dev
    working_dir: /app
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - REDIS_URL=redis://redis:6379
      - SYNC_SECRET=synapse_dev_secret_123
      - USER_ID=default
      - NODE_ENV=development
    volumes:
      - ./server:/app
      - /app/node_modules
    command: sh -c "npm install && npx tsx watch src/index.ts"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_dev_data:
